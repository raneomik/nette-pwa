<!-- The community logo (logo.svg) compacted for the 13px Tracy tab: the W squeezed to 70% of its width, P (+200) and A (-160)
     slid under it, cut out by a 130 unit gap (mask). That gap is 2.3px at this size: thinner, it blurs under a pixel and the
     letters merge; more overlap covers the A's short left leg and it stops reading as an A.
     Then cropped by 60 units on both sides (the P stem, the A right leg) and squeezed to 85% of its width by the inline style
     (preserveAspectRatio="none"): 22px wide; cropped further, the P stem gets too thin. {ID}: unique per inline copy. -->
